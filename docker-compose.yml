services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: totally-spies-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/totally_spies.db
      - DEFAULT_CONCURRENCY=15
      - DEFAULT_TIMEOUT=6.0
    volumes:
      - totally_spies_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: totally-spies-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  totally_spies_data:
